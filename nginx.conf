server {
    listen 80;
    server_name 114.132.69.85;

    # 游戏首页
    location / {
        root /opt/happy-match/frontend-simple;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理后台 - 最高优先级
    location ^~ /admin {
        alias /opt/happy-match/admin-simple;
        index login.html;
        
        # 如果访问 /admin 或 /admin/，重定向到登录页
        rewrite ^/admin/?$ /admin/login.html redirect;
        
        # SPA 回退
        try_files $uri $uri/ /admin/login.html;
    }

    # API 接口
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
